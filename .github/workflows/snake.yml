name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Grid Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: srinath-712
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#1E293B,#0E4429,#006D32,#26A641,#39D353
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22D3EE&color_dots=#1E293B,#0E4429,#006D32,#26A641,#39D353
            dist/github-contribution-grid-snake-light.svg?color_snake=#7C3AED&color_dots=#CBD5E1,#9BE9A8,#40C463,#30A14E,#216E39

      - name: Push Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
